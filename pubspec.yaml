name: pagame06
description: "PA Game 06 - DinoS"
publish_to: 'none'
version: 1.0.2+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  flame: ^1.37.0
  flame_audio: ^2.12.1
  bonfire: ^3.17.2
  url_launcher: ^6.3.2
  flutter_native_splash: ^2.4.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.1.5+1
  flutter_animate: ^4.5.2
  in_app_purchase: ^3.2.0

flutter_native_splash:
  color: "#d5f4ff"
  color_dark: "#d5f4ff"
  image: assets/favicon.png
  android: true
  ios: true
  web: false

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  hive_generator: ^2.0.1
  flutter_launcher_icons: "^0.14.4"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  min_sdk_android: 21 # android min sdk min:16, default 21
  image_path_android: "assets/favicon.png"
  image_path_ios: "assets/logo.png"

flutter:

  uses-material-design: true

  assets:
    - assets/
    - assets/image/
    - assets/audio/

  fonts:
    - family: MyIcons
      fonts:
        - asset: assets/font/icons.ttf

    - family: MyFont
      fonts:
        - asset: assets/font/medium.ttf
          weight: 500
        - asset: assets/font/bold.ttf
          weight: 700
    - family: MainFont
      fonts:
        - asset: assets/font/main.ttf

